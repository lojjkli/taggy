# Serves everything in ./public as a static site.
# There is no "main" here: an assets-only Worker needs no code at all.

name = "lojjkli-site"
compatibility_date = "2026-01-01"

[assets]
directory = "./public"
# Serve public/404.html on unknown paths; drop this line to get a plain 404.
not_found_handling = "404-page"

[[routes]]
pattern = "lojjkli.site"
custom_domain = true

[[routes]]
pattern = "www.lojjkli.site"
custom_domain = true
