name = "klisteam-relay"
main = "src/worker.js"
compatibility_date = "2026-01-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# new_sqlite_classes (not new_classes) is what makes this work on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Replace with your own subdomain. custom_domain = true makes Wrangler create the
# DNS record for you, so there is nothing to set up in the dashboard by hand.
[[routes]]
pattern = "relay.lojjkli.site"
custom_domain = true
